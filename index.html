<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ピタリ・ストップウォッチ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap">
<style>
:root{
  --sky:#7FD8F7;
  --sky-deep:#3EB8E5;
  --lemon:#FFD230;
  --orange:#FF9A28;
  --tomato:#FF4B5C;
  --grass:#4FD97A;
  --grass-deep:#2AA855;
  --peach:#FF7BB0;
  --navy:#23324D;
  --navy-soft:#5B6C88;
  --cream:#FFFDF5;
  --font-num:"Fredoka","M PLUS Rounded 1c",system-ui,sans-serif;
  --font-ja:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--sky);
  color:var(--navy);
  font-family:var(--font-ja);
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

/* ===== 背景：空 → ふわふわ漂う風船 ===== */
#sky{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(170deg,#BDEEFF 0%, var(--sky) 42%, #9BE8C6 100%);
  transition:background 1.1s ease;
}
body.hot #sky{background:linear-gradient(170deg,#FFE9A8 0%, #FFC24D 45%, var(--peach) 100%)}
#bg{position:fixed;inset:0;z-index:1;pointer-events:none;filter:blur(2px)}

/* ===== ステージ ===== */
#shell{position:relative;z-index:3}
.stage{
  height:100dvh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(10px,2.4dvh,32px);
  padding:max(10px,env(safe-area-inset-top)) 16px calc(66px + env(safe-area-inset-bottom));
  text-align:center;overflow:hidden;
}
.hidden{display:none !important}

/* 白フチのテロップ文字。フチは文字が大きいほど相対的に細く */
.telop{
  -webkit-text-stroke:.09em var(--cream);
  paint-order:stroke fill;
  text-shadow:0 .06em 0 rgba(35,50,77,.28);
}
.target-val.telop,.judge.telop{-webkit-text-stroke-width:.055em;text-shadow:0 .05em 0 rgba(35,50,77,.28)}
.btn.telop{-webkit-text-stroke-width:.05em;text-shadow:none}

/* ===== 目標秒数 ===== */
.target-block{display:flex;flex-direction:column;align-items:center;gap:.1em}
.ribbon{
  display:inline-block;
  background:var(--lemon);
  color:var(--navy);
  font-weight:900;
  font-size:min(4.4vw,3.4dvh,2.1rem);
  letter-spacing:.14em;text-indent:.14em;white-space:nowrap;
  padding:.34em 1.5em;
  border-radius:999px;
  border:.18em solid var(--cream);
  box-shadow:0 .28em 0 rgba(35,50,77,.22);
  transform:rotate(-2.5deg);
}
body.running .ribbon{font-size:min(3.2vw,2.6dvh,1.5rem)}
.target-val{
  font-family:var(--font-num);font-weight:700;
  font-variant-numeric:tabular-nums;line-height:1;
  color:var(--tomato);
  font-size:min(26vw,32dvh);
  white-space:nowrap;
}
.target-val .u{font-size:.3em;color:var(--orange);margin-left:.1em}
body.running .target-val{font-size:min(12vw,12dvh)}
.tagline{
  margin-top:.35em;font-weight:900;color:var(--navy);
  font-size:min(5vw,4dvh,2.6rem);letter-spacing:.14em;text-indent:.14em;white-space:nowrap;
}
body.running .tagline{display:none}
.keyhint{
  color:var(--navy-soft);font-weight:700;
  font-size:.78rem;letter-spacing:.1em;
}
body.running .keyhint{display:none}
@media (pointer:coarse){.keyhint{display:none}}

/* ===== 計測プレート（計測中だけ出す。観客に進行が見える）
   数字を丸に閉じ込めると桁が入りきらず折り返すので、テロップ板に置く ===== */
.meter{
  display:none;flex:none;
  font-size:min(24vw,24dvh);
  background:var(--cream);
  border:.055em solid #fff;
  border-radius:.2em;
  padding:.05em .24em;
  box-shadow:0 .085em 0 rgba(35,50,77,.25);
}
body.running .meter{display:block}
.readout{
  font-family:var(--font-num);font-weight:700;
  font-variant-numeric:tabular-nums;
  font-size:1em;line-height:1.06;
  color:var(--tomato);white-space:nowrap;
}

/* ===== ボタン ===== */
.btn{
  font-family:var(--font-ja);font-weight:900;
  border:.28rem solid var(--cream);
  cursor:pointer;color:var(--cream);white-space:nowrap;
  transition:transform .09s, box-shadow .09s;
}
.btn:focus-visible{outline:.28rem solid var(--navy);outline-offset:.3rem}
.btn:active{transform:translateY(.42rem)}
.btn-go{
  background:linear-gradient(180deg,#6BE894,var(--grass));
  font-size:min(7vw,6.4dvh,4rem);
  letter-spacing:.2em;text-indent:.2em;
  padding:.62em 1.9em;border-radius:999px;
  box-shadow:0 .55rem 0 var(--grass-deep), 0 .8rem 1.4rem rgba(35,50,77,.28);
}
.btn-go:active{box-shadow:0 .13rem 0 var(--grass-deep), 0 .3rem .7rem rgba(35,50,77,.25)}
.btn-stop{
  width:min(52vw,26dvh,280px);aspect-ratio:1;border-radius:50%;flex:none;
  background:radial-gradient(circle at 50% 32%, #FF8E97, var(--tomato) 62%, #D62438);
  font-size:min(8vw,5.2dvh,3rem);letter-spacing:.08em;text-indent:.08em;
  border-width:.5rem;
  box-shadow:0 .7rem 0 #B01B2C, 0 1rem 1.6rem rgba(35,50,77,.35);
  animation:bounce .62s ease-in-out infinite;
}
.btn-stop:active{box-shadow:0 .2rem 0 #B01B2C, 0 .4rem .9rem rgba(35,50,77,.3)}
@keyframes bounce{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-.45rem) scale(1.035)}
}
.btn-reset{
  background:linear-gradient(180deg,#FFDE63,var(--lemon));
  color:var(--navy);
  font-size:min(5.2vw,5dvh,3rem);
  letter-spacing:.16em;text-indent:.16em;
  padding:.6em 1.9em;border-radius:999px;
  box-shadow:0 .55rem 0 #D9A210, 0 .8rem 1.4rem rgba(35,50,77,.28);
}
.btn-reset:active{box-shadow:0 .13rem 0 #D9A210, 0 .3rem .7rem rgba(35,50,77,.25)}
.btn-chip{
  background:var(--cream);color:var(--navy);font-weight:900;
  border:.16rem solid var(--navy);border-radius:999px;
  font-size:.86rem;letter-spacing:.06em;
  padding:.5em 1.1em;cursor:pointer;
  box-shadow:0 .2rem 0 rgba(35,50,77,.35);
}
.btn-chip:active{transform:translateY(.16rem);box-shadow:0 .05rem 0 rgba(35,50,77,.35)}
.btn-chip[aria-pressed="true"]{background:var(--grass);color:var(--cream);border-color:var(--grass-deep)}
.btn-chip:focus-visible{outline:.18rem solid var(--navy);outline-offset:.2rem}

/* 計測中は画面のどこを押しても止まる（反応が速いほうが公平） */
#tapstop{position:fixed;inset:0;z-index:20;display:none}
body.running #tapstop{display:block}

/* ===== 結果 ===== */
.judge{
  font-weight:900;line-height:1.06;
  font-size:min(11vw,14dvh);
  color:var(--tomato);white-space:nowrap;
}
.judge.rainbow{animation:rb .68s linear infinite}
@keyframes rb{
  0%{color:#FF4B5C}20%{color:#FF9A28}40%{color:#FFD230}
  60%{color:#4FD97A}80%{color:#3EB8E5}100%{color:#A97BFF}
}
.judge.hit{color:var(--orange)}
.judge.miss{color:var(--sky-deep)}
.slam{animation:slam .55s cubic-bezier(.34,1.56,.64,1) both}
@keyframes slam{0%{transform:scale(2.3) rotate(-9deg);opacity:0}55%{transform:scale(1) rotate(2deg);opacity:1}100%{transform:scale(1) rotate(0)}}
.diff{
  font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:600;
  font-size:min(6vw,5.6dvh,3.4rem);color:var(--navy);white-space:nowrap;
  background:var(--cream);border:.2rem solid var(--navy);
  border-radius:999px;padding:.16em .9em;
  box-shadow:0 .24rem 0 rgba(35,50,77,.3);
}
.result-time{
  font-family:var(--font-num);font-weight:700;font-variant-numeric:tabular-nums;
  font-size:min(27vw,33dvh);line-height:1;color:var(--cream);white-space:nowrap;
  -webkit-text-stroke:.045em var(--navy);paint-order:stroke fill;
  text-shadow:0 .05em 0 rgba(35,50,77,.35);
}
.result-time .unit{font-size:.27em;margin-left:.1em}

/* ===== 設定パネル ===== */
.row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
input[type=number]{
  font-family:var(--font-num);font-size:1.15rem;font-weight:600;
  background:#fff;color:var(--navy);
  border:.18rem solid var(--navy);border-radius:.8rem;
  padding:.46em .6em;width:130px;text-align:center;
}
input:focus{outline:.18rem solid var(--grass);outline-offset:.15rem}

.overlay{
  position:fixed;inset:0;z-index:30;
  background:rgba(126,216,247,.97);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px 16px;gap:14px;
}
.overlay h2{
  font-weight:900;font-size:1.5rem;color:var(--navy);
  background:var(--lemon);border:.2rem solid var(--cream);
  border-radius:999px;padding:.2em 1.4em;
  box-shadow:0 .3rem 0 rgba(35,50,77,.25);
  transform:rotate(-2deg);
}
.setting-row{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  width:min(440px,100%);
  background:var(--cream);border:.16rem solid var(--navy);border-radius:1rem;
  padding:.7em .9em;
  box-shadow:0 .22rem 0 rgba(35,50,77,.28);
}
.setting-row .label{font-weight:900;letter-spacing:.02em;text-align:left}
.setting-row small{display:block;color:var(--navy-soft);font-weight:700;font-size:.76rem;margin-top:.1em}

/* ===== 下部バー ===== */
.corner{
  position:fixed;z-index:15;
  bottom:max(12px,env(safe-area-inset-bottom));
  right:14px;
  transition:opacity .25s;
}
body.running .corner{opacity:0;pointer-events:none}

/* ===== エフェクト ===== */
#fx{position:fixed;inset:0;z-index:40;pointer-events:none}
#flash{position:fixed;inset:0;z-index:35;pointer-events:none;background:#fff;opacity:0}
#flash.on{animation:flash .3s ease-out}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}
.shake{animation:shake .42s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{
  10%,90%{transform:translate(-3px,1px)}
  20%,80%{transform:translate(6px,-2px)}
  30%,50%,70%{transform:translate(-12px,3px)}
  40%,60%{transform:translate(12px,-3px)}
  100%{transform:translate(0,0)}
}

/* 横向きスマホなど背の低い画面：全部を一回り小さくして必ず収める */
@media (max-height:560px){
  .tagline,.keyhint{display:none}
  .btn-chip{font-size:.74rem;padding:.42em .8em}
  .stage{gap:8px;padding-bottom:calc(46px + env(safe-area-inset-bottom))}
  .ribbon,body.running .ribbon{font-size:.82rem;padding:.28em 1.2em}
  .meter{font-size:min(15vw,20dvh)}
  .btn-stop{width:min(24vw,20dvh,150px);font-size:min(3.2vw,3.2dvh,1.2rem);border-width:.3rem}
  .btn-go{font-size:min(5vw,5.6dvh,2rem);padding:.5em 1.6em}
  .judge{font-size:min(10vw,12dvh)}
  .diff{font-size:min(5vw,5.2dvh,2rem)}
  .result-time{font-size:min(30vw,29dvh)}
  .btn-reset{font-size:min(4vw,4.4dvh,1.4rem);padding:.5em 1.6em}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}
</style>
</head>
<body>
<div id="sky"></div>
<canvas id="bg"></canvas>

<div id="shell">
  <main class="stage" id="game">
    <div class="target-block">
      <div class="ribbon">めざせ</div>
      <div class="target-val telop"><span id="targetLabel">10.00</span><span class="u">びょう</span></div>
      <p class="tagline telop">ぴったりで とめてね！</p>
    </div>

    <div class="meter">
      <div class="readout" id="timer">0.00</div>
    </div>

    <button class="btn btn-go telop" id="startBtn">スタート</button>
    <p class="keyhint">スペース / エンター でも操作できます</p>
    <button class="btn btn-stop telop hidden" id="stopBtn">ストップ</button>
  </main>

  <section class="stage hidden" id="result">
    <div class="judge telop" id="judge"></div>
    <div class="diff" id="diff"></div>
    <div class="result-time"><span id="resultTime">0.00</span><span class="unit">びょう</span></div>
    <button class="btn btn-reset telop" id="resetBtn">はじめから</button>
  </section>

  <div class="corner">
    <button class="btn-chip" id="settingsBtn">せってい</button>
  </div>
</div>

<div id="tapstop"></div>

<div class="overlay hidden" id="settings">
  <h2>せってい</h2>
  <div class="setting-row">
    <span class="label">なんびょう？</span>
    <span class="row"><input type="number" id="targetInput" step="0.01" min="0.1" value="10"><button class="btn-chip" id="applyBtn">かえる</button></span>
  </div>
  <div class="setting-row">
    <span class="label">おと</span>
    <button class="btn-chip" id="soundBtn" aria-pressed="true">ON</button>
  </div>
  <div class="setting-row">
    <span class="label">ぜんがめん</span>
    <button class="btn-chip" id="fsBtn">きりかえ</button>
  </div>
  <button class="btn-chip" id="closeSettingsBtn" style="margin-top:6px">とじる</button>
</div>

<div id="flash"></div>
<canvas id="fx"></canvas>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  var target = 10.00, running = false, startAt = 0, raf = 0, soundOn = true;

  /* ---------- 背景：ふわふわ漂う風船 ----------
     周期の揃わない正弦波を重ねているので、動きを数えても
     「いま何秒か」のヒントにはならない。 */
  var bg = $("bg"), bctx = bg.getContext("2d"), BW = 0, BH = 0;
  var BALLOONS = [
    { fx:0.051, fy:0.073, px:0.00, py:1.73, r:0.20, c:"#FFD230" },
    { fx:0.037, fy:0.059, px:2.11, py:0.44, r:0.26, c:"#FF7BB0" },
    { fx:0.089, fy:0.043, px:4.31, py:3.17, r:0.16, c:"#A97BFF" },
    { fx:0.067, fy:0.097, px:1.27, py:5.51, r:0.22, c:"#FFFFFF" },
    { fx:0.029, fy:0.083, px:5.02, py:2.28, r:0.18, c:"#4FD97A" },
    { fx:0.101, fy:0.031, px:3.44, py:4.66, r:0.13, c:"#FF9A28" }
  ];
  function fitBg(){
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    BW = innerWidth; BH = innerHeight;
    bg.width = BW * dpr; bg.height = BH * dpr;
    bg.style.width = BW + "px"; bg.style.height = BH + "px";
    bctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  fitBg();
  addEventListener("resize", fitBg);

  var phase = 0, speed = 1, speedTo = 1, prevT = 0;
  function drawBg(now){
    var dt = prevT ? Math.min((now - prevT) / 1000, 0.05) : 0.016;
    prevT = now;
    speed += (speedTo - speed) * 0.05;
    phase += dt * speed;

    bctx.clearRect(0, 0, BW, BH);
    var unit = Math.min(BW, BH);
    for (var i = 0; i < BALLOONS.length; i++){
      var b = BALLOONS[i];
      var x = BW * (0.5 + 0.46 * Math.sin(phase * b.fx * 6.2832 + b.px));
      var y = BH * (0.5 + 0.46 * Math.sin(phase * b.fy * 6.2832 + b.py));
      var r = unit * b.r;
      bctx.globalAlpha = 0.34;
      bctx.fillStyle = b.c;
      bctx.beginPath(); bctx.arc(x, y, r, 0, 6.2832); bctx.fill();
      bctx.globalAlpha = 0.5;
      bctx.fillStyle = "#FFFFFF";
      bctx.beginPath(); bctx.arc(x - r * 0.32, y - r * 0.36, r * 0.2, 0, 6.2832); bctx.fill();
    }
    bctx.globalAlpha = 1;
    if (!reduced) requestAnimationFrame(drawBg);
  }
  drawBg(performance.now());   // 1枚目は即描く

  function setMood(mode){                    // idle / hot / run
    document.body.classList.toggle("hot", mode !== "idle");
    speedTo = mode === "run" ? 3.2 : (mode === "hot" ? 1.8 : 1);
  }

  /* ---------- 音（やわらかい丸い音） ---------- */
  var actx = null;
  function ac(){
    if (!soundOn) return null;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") actx.resume();
      return actx;
    } catch (e) { return null; }
  }
  function tone(freq, dur, type, vol, delay){
    var c = ac(); if (!c) return;
    var t0 = c.currentTime + (delay || 0);
    var osc = c.createOscillator(), g = c.createGain();
    osc.type = type || "triangle";
    osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + 0.014);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(c.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  }
  function melody(notes, type, vol){
    var t = 0;
    notes.forEach(function(n){ tone(n[0], n[1], type, vol, t); t += n[1] * 0.7; });
  }

  /* ---------- 紙吹雪（まると星） ---------- */
  var cvs = $("fx"), ctx = cvs.getContext("2d"), parts = [], fxRaf = 0;
  function fitFx(){
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    cvs.width = innerWidth * dpr; cvs.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  fitFx();
  addEventListener("resize", fitFx);

  var POP = ["#FF4B5C","#FF9A28","#FFD230","#4FD97A","#3EB8E5","#FF7BB0","#A97BFF","#FFFFFF"];
  function star(g, r){
    g.beginPath();
    for (var i = 0; i < 10; i++){
      var rad = (i % 2 ? r * 0.46 : r), a = (Math.PI / 5) * i - Math.PI / 2;
      g.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
    }
    g.closePath(); g.fill();
  }
  function burst(count, power){
    if (reduced) return;
    var cx = innerWidth / 2, cy = innerHeight * 0.42;
    for (var i = 0; i < count; i++){
      var a = (-Math.PI / 2) + (Math.random() - 0.5) * 2.4;
      var sp = (Math.random() * 0.6 + 0.5) * power;
      parts.push({
        x: cx + (Math.random() - 0.5) * 100, y: cy + (Math.random() - 0.5) * 60,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        r: 7 + Math.random() * 9,
        rot: Math.random() * 6.3, vr: (Math.random() - 0.5) * 0.3,
        star: Math.random() < 0.45,
        c: POP[(Math.random() * POP.length) | 0]
      });
    }
    if (!fxRaf) fxRaf = requestAnimationFrame(fxLoop);
  }
  function fxLoop(){
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (var i = parts.length - 1; i >= 0; i--){
      var p = parts[i];
      p.vy += 0.3; p.vx *= 0.992; p.vy *= 0.992;
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      if (p.y > innerHeight + 60) { parts.splice(i, 1); continue; }
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.c;
      if (p.star) star(ctx, p.r);
      else { ctx.beginPath(); ctx.arc(0, 0, p.r * 0.72, 0, 6.2832); ctx.fill(); }
      ctx.restore();
    }
    if (parts.length) fxRaf = requestAnimationFrame(fxLoop);
    else { fxRaf = 0; ctx.clearRect(0, 0, innerWidth, innerHeight); }
  }
  function flash(){
    if (reduced) return;
    var f = $("flash");
    f.classList.remove("on"); void f.offsetWidth; f.classList.add("on");
  }
  function shake(){
    if (reduced) return;
    var s = $("shell");
    s.classList.remove("shake"); void s.offsetWidth; s.classList.add("shake");
  }
  function replay(el, cls){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

  /* ---------- 計測（進行はいつも見える） ---------- */
  function tick(){
    var sec = (performance.now() - startAt) / 1000;
    $("timer").textContent = sec.toFixed(2);
    raf = requestAnimationFrame(tick);
  }

  function start(){
    if (running) return;
    ac();
    tone(1046, 0.16, "triangle", 0.22);
    running = true;
    document.body.classList.add("running");
    setMood("run");
    $("startBtn").classList.add("hidden");
    $("stopBtn").classList.remove("hidden");
    $("timer").textContent = "0.00";
    startAt = performance.now();
    raf = requestAnimationFrame(tick);
  }

  function stop(){
    if (!running) return;
    running = false;
    cancelAnimationFrame(raf);
    var sec = Number(((performance.now() - startAt) / 1000).toFixed(2));
    document.body.classList.remove("running");
    setMood("hot");
    flash(); shake();
    tone(240, 0.26, "sine", 0.24);
    showResult(sec, Number((sec - target).toFixed(2)));
  }

  var GRADES = [
    { max: 0,    label: "\u{1F308} かんぺき！！", cls: "rainbow", conf: 280, notes: [[523,.16],[659,.16],[784,.16],[1046,.5]] },
    { max: 0.01, label: "\u{2728} きせき！",      cls: "hit",     conf: 220, notes: [[659,.15],[880,.15],[1175,.44]] },
    { max: 0.05, label: "\u{1F38A} すごい！",     cls: "hit",     conf: 150, notes: [[523,.14],[784,.14],[1046,.38]] },
    { max: 0.10, label: "\u{1F389} やったね！",   cls: "hit",     conf: 100, notes: [[523,.14],[659,.14],[880,.32]] },
    { max: 0.30, label: "\u{1F44D} いいね！",     cls: "",        conf: 50,  notes: [[523,.14],[659,.28]] },
    { max: 1e9,  label: "\u{1F4AA} ドンマイ！",    cls: "miss",    conf: 0,   notes: [[392,.16],[294,.3]] }
  ];

  function showResult(sec, delta){
    var ad = Math.abs(delta), g = GRADES[GRADES.length - 1];
    for (var i = 0; i < GRADES.length; i++){ if (ad <= GRADES[i].max){ g = GRADES[i]; break; } }

    $("judge").textContent = g.label;
    $("judge").className = "judge telop " + g.cls;
    $("diff").textContent = (delta >= 0 ? "+" : "") + delta.toFixed(2) + " びょう";
    $("game").classList.add("hidden");
    $("result").classList.remove("hidden");
    replay($("judge"), "slam");

    var el = $("resultTime"), t0 = performance.now(), dur = reduced ? 0 : 540;
    (function up(){
      var k = dur ? Math.min(1, (performance.now() - t0) / dur) : 1;
      el.textContent = (sec * (1 - Math.pow(1 - k, 3))).toFixed(2);
      if (k < 1) requestAnimationFrame(up);
      else {
        el.textContent = sec.toFixed(2);
        melody(g.notes, "triangle", 0.22);
        if (g.conf) burst(g.conf, g.conf > 200 ? 17 : 13);
        if (g.conf > 200) setTimeout(function(){ burst(g.conf, 15); }, 430);
      }
    })();
  }

  function reset(){
    setMood("idle");
    $("result").classList.add("hidden");
    $("game").classList.remove("hidden");
    $("stopBtn").classList.add("hidden");
    $("startBtn").classList.remove("hidden");
    $("timer").textContent = "0.00";
  }

  /* ---------- 操作 ---------- */
  $("startBtn").addEventListener("click", start);
  $("resetBtn").addEventListener("click", reset);
  // 計測中は画面のどこを押しても止まる
  $("tapstop").addEventListener("pointerdown", function(e){ e.preventDefault(); stop(); });

  $("applyBtn").addEventListener("click", function(){
    var v = Number($("targetInput").value);
    if (v > 0){ target = v; $("targetLabel").textContent = v.toFixed(2); tone(880, 0.12, "triangle", 0.18); }
    else { $("targetInput").value = target; }
  });

  $("soundBtn").addEventListener("click", function(){
    soundOn = !soundOn;
    this.setAttribute("aria-pressed", soundOn ? "true" : "false");
    this.textContent = soundOn ? "ON" : "OFF";
    if (soundOn) tone(880, 0.14, "triangle", 0.2);
  });

  $("settingsBtn").addEventListener("click", function(){ $("settings").classList.remove("hidden"); });
  $("closeSettingsBtn").addEventListener("click", function(){ $("settings").classList.add("hidden"); });

  $("fsBtn").addEventListener("click", toggleFs);
  function toggleFs(){
    if (!document.fullscreenElement){
      if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
    } else { document.exitFullscreen(); }
  }

  document.addEventListener("keydown", function(e){
    if (e.target && e.target.tagName === "INPUT"){
      if (e.key === "Enter"){ e.preventDefault(); $("applyBtn").click(); }
      return;
    }
    if (e.key === "f" || e.key === "F") toggleFs();
    if (e.key === "Escape") $("settings").classList.add("hidden");
    if (e.code === "Space" || e.key === "Enter"){
      e.preventDefault();
      if (e.repeat) return;
      if (!$("settings").classList.contains("hidden")) return;
      if (running) stop();
      else if (!$("result").classList.contains("hidden")) reset();
      else start();
    }
  });
})();
</script>
</body>
</html>
