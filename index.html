<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ピタリ・ストップウォッチ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@300;400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
:root{
  --ink:#04060A;
  --panel:#111926;
  --line:#2C3B52;
  --text:#F2F7FC;
  --muted:#93A6BE;
  --amber:#FFB627;
  --amber-hot:#FFD75E;
  --cyan:#3FE9FA;
  --go:#3DDC84;
  --stop:#FF3B55;
  --font-num:"Chivo Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --font-ja:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--ink);
  color:var(--text);
  font-family:var(--font-ja);
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

/* ===== 背景：ゆらめく光（不規則な周期＝時間のヒントにならない） ===== */
#bg{
  position:fixed;left:-9%;top:-9%;width:118%;height:118%;
  z-index:0;pointer-events:none;
  filter:blur(26px) saturate(1.25);
  opacity:.85;
}
/* 中央を沈めて文字を浮かせる（見やすさの要） */
#vignette{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(ellipse 64% 52% at 50% 46%, rgba(4,6,10,.88) 0%, rgba(4,6,10,.66) 46%, rgba(4,6,10,0) 80%),
    linear-gradient(180deg, rgba(4,6,10,.55), transparent 22%, transparent 78%, rgba(4,6,10,.7));
}

/* ===== ステージ ===== */
#shell{position:relative;z-index:2}
.stage{
  height:100dvh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(10px,2.2dvh,34px);
  padding:max(10px,env(safe-area-inset-top)) 16px calc(64px + env(safe-area-inset-bottom));
  text-align:center;overflow:hidden;
}
.hidden{display:none !important}

/* ===== 目標秒数 ===== */
.target-block{display:flex;flex-direction:column;align-items:center;gap:.15em}
.eyebrow{
  font-family:var(--font-num);font-size:min(3.4vw,.92rem);font-weight:400;
  letter-spacing:.5em;text-indent:.5em;text-transform:uppercase;color:var(--cyan);
  text-shadow:0 0 18px rgba(63,233,250,.75);
}
.target-val{
  font-family:var(--font-num);font-weight:700;
  font-variant-numeric:tabular-nums;line-height:.92;
  color:#FFF3CF;
  font-size:min(19vw,15dvh,9.5rem);
  text-shadow:0 0 6px #fff,0 0 26px #FFB627,0 0 70px rgba(255,182,39,.7),0 0 150px rgba(255,182,39,.4);
  transition:font-size .4s cubic-bezier(.16,1,.3,1);
}
.target-val .u{font-size:.3em;color:var(--amber);margin-left:.16em;text-shadow:0 0 20px rgba(255,182,39,.7)}
body.running .target-val{font-size:min(13vw,10dvh,5.4rem)}
.tagline{
  margin-top:.4em;color:var(--text);opacity:.72;font-weight:900;
  font-size:min(4.6vw,3.2dvh,1.5rem);letter-spacing:.3em;text-indent:.3em;
}
.tagline.hot{
  color:var(--stop);opacity:1;
  text-shadow:0 0 26px rgba(255,59,85,.9);
  animation:hotPulse .82s ease-in-out infinite;
}
@keyframes hotPulse{50%{opacity:.45}}
body:not(.running) #tagRun{display:none}
body.running #tagReady{display:none}
.keyhint{
  color:var(--muted);opacity:.55;
  font-family:var(--font-num);font-size:.74rem;letter-spacing:.16em;
}
body.running .keyhint{display:none}
@media (pointer:coarse){.keyhint{display:none}}

/* ===== 計測ダイヤル（数字を出すモードのときだけ） ===== */
.dial{
  position:relative;flex:none;
  width:min(78vw,38dvh,460px);
  aspect-ratio:1;display:grid;place-items:center;
  transition:width .4s cubic-bezier(.16,1,.3,1);
}
body.running .dial{width:min(88vw,46dvh,540px)}
body.blind .dial{display:none}
.dial-track{position:absolute;inset:0;border-radius:50%;border:1px solid var(--line)}
.dial-ring{
  position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from -90deg, var(--amber-hot) 0deg, rgba(255,182,39,0) 0deg);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 10px),#000 calc(100% - 9px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 10px),#000 calc(100% - 9px));
  opacity:0;transition:opacity .2s;
  filter:drop-shadow(0 0 12px rgba(255,182,39,.95));
}
body.running .dial-ring{opacity:1}
.dial-ticks{position:absolute;inset:0;border-radius:50%;opacity:.5}
.readout{
  font-family:var(--font-num);font-weight:700;
  font-variant-numeric:tabular-nums;
  font-size:min(21vw,12dvh,7.4rem);
  line-height:1;letter-spacing:-.02em;color:var(--text);
  transition:font-size .4s cubic-bezier(.16,1,.3,1);
}
body.running .readout{
  font-size:min(26vw,15dvh,9.2rem);color:#fff;
  text-shadow:0 0 14px #fff,0 0 55px rgba(255,182,39,.85),0 0 120px rgba(255,182,39,.45);
}

/* ===== ボタン ===== */
.btn{
  font-family:var(--font-ja);font-weight:900;
  border:none;border-radius:5px;cursor:pointer;color:#041016;
  transition:transform .08s;position:relative;overflow:hidden;
}
.btn:focus-visible{outline:4px solid var(--cyan);outline-offset:5px}
.btn:active{transform:translateY(3px)}
.btn-go{
  background:linear-gradient(180deg,#6DF7B0,var(--go));
  font-size:min(7vw,5.4dvh,2.4rem);
  letter-spacing:.28em;text-indent:.28em;padding:.72em 2.6em;
  box-shadow:0 8px 0 #146C45, 0 0 60px rgba(61,220,132,.6);
}
.btn-go::after{
  content:"";position:absolute;top:0;bottom:0;width:45%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);
  animation:shine 2.6s ease-in-out infinite;
}
@keyframes shine{0%{left:-60%}55%,100%{left:120%}}
.btn-stop{
  width:min(74vw,46dvh,380px);aspect-ratio:1;border-radius:50%;flex:none;
  background:radial-gradient(circle at 50% 34%, #FF93A4, var(--stop) 56%, #8E0A20);
  color:#fff;font-size:min(11vw,7.4dvh,4rem);letter-spacing:.16em;text-indent:.16em;
  border:10px solid #fff;
  box-shadow:0 0 0 10px rgba(255,59,85,.22), 0 0 120px rgba(255,59,85,.75);
  animation:breathe .9s ease-in-out infinite, blink .55s steps(1) infinite;
}
@keyframes breathe{50%{box-shadow:0 0 0 26px rgba(255,59,85,.1), 0 0 170px rgba(255,59,85,.95)}}
@keyframes blink{
  0%,49%{text-shadow:0 0 10px #fff,0 0 26px #fff}
  50%,100%{color:#FFF27A;text-shadow:0 0 18px #FFF27A,0 0 50px #FFF27A,0 0 90px #FFB627}
}
.btn-reset{
  background:linear-gradient(180deg,var(--amber-hot),var(--amber));
  font-size:min(5vw,4.2dvh,1.7rem);
  letter-spacing:.24em;text-indent:.24em;padding:.7em 2.5em;
  box-shadow:0 8px 0 #8B5D08, 0 0 50px rgba(255,182,39,.55);
}
.btn-ghost{
  background:rgba(9,14,22,.88);color:var(--muted);
  border:1px solid var(--line);border-radius:4px;
  font-family:var(--font-num);font-size:.8rem;letter-spacing:.16em;
  text-transform:uppercase;padding:.66em 1.1em;cursor:pointer;
  backdrop-filter:blur(8px);
}
.btn-ghost:hover{color:var(--text);border-color:var(--cyan)}
.btn-ghost[aria-pressed="true"]{color:#041016;background:var(--cyan);border-color:var(--cyan);font-weight:700}
.btn-ghost:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}

/* ===== カウントダウン ===== */
#countdown{
  position:fixed;inset:0;z-index:25;
  display:flex;align-items:center;justify-content:center;
  background:rgba(4,6,10,.86);
}
#cdNum{
  font-family:var(--font-num);font-weight:700;
  font-size:min(50vw,48dvh,28rem);line-height:1;color:#FFF3CF;
  text-shadow:0 0 40px #FFB627,0 0 120px rgba(255,182,39,.85),0 0 260px rgba(255,182,39,.5);
}
#cdNum.go{color:#D6FFEA;text-shadow:0 0 40px var(--go),0 0 130px rgba(61,220,132,.85);font-size:min(30vw,32dvh,16rem)}
.pop{animation:pop .62s cubic-bezier(.16,1,.3,1) both}
@keyframes pop{0%{transform:scale(2.6);opacity:0;filter:blur(16px)}45%{transform:scale(1);opacity:1;filter:blur(0)}100%{transform:scale(.94);opacity:.88}}

/* ===== 結果 ===== */
.judge{
  font-weight:900;line-height:1;
  font-size:min(11vw,11dvh,6rem);
  letter-spacing:.03em;text-wrap:balance;color:var(--text);
  text-shadow:0 0 30px rgba(255,255,255,.4);
}
.judge.rainbow{animation:rb .7s linear infinite}
@keyframes rb{
  0%{color:#FF3B55;text-shadow:0 0 36px #FF3B55}
  20%{color:#FFB627;text-shadow:0 0 36px #FFB627}
  40%{color:#FFF27A;text-shadow:0 0 36px #FFF27A}
  60%{color:#3DDC84;text-shadow:0 0 36px #3DDC84}
  80%{color:#3FE9FA;text-shadow:0 0 36px #3FE9FA}
  100%{color:#FF2D95;text-shadow:0 0 36px #FF2D95}
}
.judge.hit{color:#FFF3CF;text-shadow:0 0 24px #FFB627,0 0 90px rgba(255,182,39,.8)}
.slam{animation:slam .5s cubic-bezier(.16,1,.3,1) both}
@keyframes slam{0%{transform:scale(2.2) rotate(-6deg);opacity:0}60%{transform:scale(.94) rotate(1deg);opacity:1}100%{transform:scale(1) rotate(0)}}
.diff{
  font-family:var(--font-num);font-variant-numeric:tabular-nums;
  font-size:min(6vw,4.4dvh,2.4rem);color:var(--cyan);letter-spacing:.08em;
  text-shadow:0 0 26px rgba(63,233,250,.6);
}
.result-time{
  font-family:var(--font-num);font-weight:700;font-variant-numeric:tabular-nums;
  font-size:min(29vw,23dvh,11.5rem);line-height:1;color:#FFF3CF;
  text-shadow:0 0 20px #FFB627,0 0 90px rgba(255,182,39,.6);
}
.result-time .unit{font-size:.28em;color:var(--amber);margin-left:.16em}

/* ===== 設定パネル ===== */
.row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
input[type=number]{
  font-family:var(--font-num);font-size:1.05rem;
  background:rgba(9,14,22,.9);color:var(--text);
  border:1px solid var(--line);border-radius:4px;
  padding:.62em .8em;width:160px;text-align:center;
}
input:focus{outline:2px solid var(--cyan);outline-offset:1px}

.overlay{
  position:fixed;inset:0;z-index:30;
  background:rgba(4,6,10,.97);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px 16px;gap:16px;
}
.overlay h2{
  font-family:var(--font-num);font-weight:400;font-size:.88rem;
  letter-spacing:.36em;text-indent:.36em;text-transform:uppercase;color:var(--cyan);
  text-shadow:0 0 18px rgba(63,233,250,.6);
}
.setting-row{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  width:min(440px,100%);padding:.78em 0;border-bottom:1px solid var(--line);
}
.setting-row span.label{font-weight:700;letter-spacing:.04em}
.setting-row small{display:block;color:var(--muted);font-weight:400;font-size:.78rem;letter-spacing:0;margin-top:.15em}

/* ===== 下部バー ===== */
.corner{
  position:fixed;z-index:15;
  bottom:max(12px,env(safe-area-inset-bottom));
  left:12px;right:12px;
  display:flex;gap:10px;align-items:center;justify-content:flex-end;
  transition:opacity .25s;
}
body.running .corner,body.counting .corner{opacity:0;pointer-events:none}

/* ===== エフェクト ===== */
#fx{position:fixed;inset:0;z-index:40;pointer-events:none}
#flash{position:fixed;inset:0;z-index:35;pointer-events:none;background:#fff;opacity:0}
#flash.on{animation:flash .28s ease-out}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
.shake{animation:shake .4s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{
  10%,90%{transform:translate(-3px,1px)}
  20%,80%{transform:translate(6px,-2px)}
  30%,50%,70%{transform:translate(-12px,3px)}
  40%,60%{transform:translate(12px,-3px)}
  100%{transform:translate(0,0)}
}

@media (max-height:560px){
  .tagline,.keyhint{display:none}
  .corner{gap:6px}
  .btn-ghost{font-size:.68rem;padding:.48em .75em}
  .stage{padding-bottom:calc(50px + env(safe-area-inset-bottom))}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="vignette"></div>

<div id="shell">
  <main class="stage" id="game">
    <div class="target-block">
      <div class="eyebrow">Target</div>
      <div class="target-val"><span id="targetLabel">10.00</span><span class="u">秒</span></div>
      <p class="tagline" id="tagReady">ぴったりで止めろ</p>
      <p class="tagline hot" id="tagRun">今だ！止めろ</p>
    </div>

    <div class="dial">
      <div class="dial-track"></div>
      <svg class="dial-ticks" viewBox="0 0 200 200" aria-hidden="true"><g id="ticks" stroke="#2C3B52" stroke-width="1.6"></g></svg>
      <div class="dial-ring" id="ring"></div>
      <div class="readout" id="timer">0.00</div>
    </div>

    <button class="btn btn-go" id="startBtn">START</button>
    <p class="keyhint">スペース / エンター でも操作できます</p>
    <button class="btn btn-stop hidden" id="stopBtn">STOP</button>
  </main>

  <section class="stage hidden" id="result">
    <div class="judge" id="judge"></div>
    <div class="diff" id="diff"></div>
    <div class="result-time"><span id="resultTime">0.00</span><span class="unit">秒</span></div>
    <button class="btn btn-reset" id="resetBtn">もう一回</button>
  </section>

  <div id="countdown" class="hidden"><div id="cdNum">3</div></div>

  <div class="corner" id="corner">
    <button class="btn-ghost" id="settingsBtn">設定</button>
  </div>
</div>

<div class="overlay hidden" id="settings">
  <h2>Settings</h2>
  <div class="setting-row">
    <span class="label">目標の秒数</span>
    <span class="row"><input type="number" id="targetInput" step="0.01" min="0.1" value="10" style="width:110px"><button class="btn-ghost" id="applyBtn">変更</button></span>
  </div>
  <div class="setting-row">
    <span class="label">目隠し<small>数字を消してカンだけで勝負</small></span>
    <button class="btn-ghost" id="blindBtn" aria-pressed="true">ON</button>
  </div>
  <div class="setting-row">
    <span class="label">3・2・1 カウントダウン</span>
    <button class="btn-ghost" id="cdBtn" aria-pressed="true">ON</button>
  </div>
  <div class="setting-row">
    <span class="label">効果音</span>
    <button class="btn-ghost" id="soundBtn" aria-pressed="true">ON</button>
  </div>
  <div class="setting-row">
    <span class="label">全画面表示</span>
    <button class="btn-ghost" id="fsBtn">切替</button>
  </div>
  <button class="btn-ghost" id="closeSettingsBtn" style="margin-top:8px">閉じる</button>
</div>

<div id="flash"></div>
<canvas id="fx"></canvas>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  var target = 10.00, running = false, counting = false, startAt = 0, raf = 0;
  var useCountdown = true, soundOn = true;

  document.body.classList.add("blind");   // 初期状態は目隠しON

  /* ---------- 背景の光 ----------
     ゆらぎは無理数に近い比の正弦波を重ねて作る。周期が揃わないので、
     「何回光ったら何秒」というカンニングができない。 */
  var bg = $("bg"), bctx = bg.getContext("2d"), BW = 170, BH = 170;
  bg.width = BW; bg.height = BH;

  var BLOBS = [
    { fx:0.053, fy:0.071, px:0.00, py:1.73, r:0.62 },
    { fx:0.037, fy:0.061, px:2.11, py:0.44, r:0.70 },
    { fx:0.089, fy:0.043, px:4.31, py:3.17, r:0.54 },
    { fx:0.067, fy:0.097, px:1.27, py:5.51, r:0.58 }
  ];
  var PAL_IDLE = ["255,182,39", "63,233,250", "108,86,255", "255,182,39"];
  var PAL_HOT  = ["255,182,39", "255,45,149", "255,59,85", "255,215,94"];

  var bgPhase = 0, speed = 1, speedTo = 1, bgPrev = 0;
  function drawBg(now){
    var dt = bgPrev ? Math.min((now - bgPrev) / 1000, 0.05) : 0.016;
    bgPrev = now;
    speed += (speedTo - speed) * 0.045;
    bgPhase += dt * speed;

    var pal = document.body.classList.contains("hot") ? PAL_HOT : PAL_IDLE;
    bctx.globalCompositeOperation = "source-over";
    bctx.fillStyle = "#04060A";
    bctx.fillRect(0, 0, BW, BH);
    bctx.globalCompositeOperation = "lighter";
    for (var i = 0; i < BLOBS.length; i++){
      var b = BLOBS[i], t = bgPhase;
      var x = BW * (0.5 + 0.42 * Math.sin(t * b.fx * 6.2832 + b.px));
      var y = BH * (0.5 + 0.42 * Math.sin(t * b.fy * 6.2832 + b.py));
      var r = BW * b.r;
      var g = bctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, "rgba(" + pal[i] + ",0.55)");
      g.addColorStop(0.55, "rgba(" + pal[i] + ",0.16)");
      g.addColorStop(1, "rgba(" + pal[i] + ",0)");
      bctx.fillStyle = g;
      bctx.beginPath(); bctx.arc(x, y, r, 0, 6.2832); bctx.fill();
    }
    if (!reduced) requestAnimationFrame(drawBg);
  }
  drawBg(performance.now());   // 1枚目は即描く（描画が止まる環境でも真っ暗にしない）
  function setMood(mode){          // idle / hot / run
    document.body.classList.toggle("hot", mode !== "idle");
    speedTo = mode === "run" ? 3.4 : (mode === "hot" ? 1.9 : 1);
  }

  /* ---------- ダイヤルの目盛り ---------- */
  (function(){
    var s = "";
    for (var i = 0; i < 60; i++){
      var a = (i * 6 - 90) * Math.PI / 180;
      var long = i % 5 === 0, r1 = long ? 83 : 90, r2 = 97;
      s += '<line x1="' + (100 + Math.cos(a) * r1).toFixed(1) + '" y1="' + (100 + Math.sin(a) * r1).toFixed(1)
         + '" x2="' + (100 + Math.cos(a) * r2).toFixed(1) + '" y2="' + (100 + Math.sin(a) * r2).toFixed(1)
         + '" stroke-opacity="' + (long ? 1 : 0.4) + '"/>';
    }
    $("ticks").innerHTML = s;
  })();

  /* ---------- 音 ---------- */
  var actx = null;
  function ac(){
    if (!soundOn) return null;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") actx.resume();
      return actx;
    } catch (e) { return null; }
  }
  function tone(freq, dur, type, vol, delay){
    var c = ac(); if (!c) return;
    var t0 = c.currentTime + (delay || 0);
    var osc = c.createOscillator(), g = c.createGain();
    osc.type = type || "square";
    osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.18, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(c.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  }
  function melody(notes, type, vol){
    var t = 0;
    notes.forEach(function(n){ tone(n[0], n[1], type, vol, t); t += n[1] * 0.72; });
  }

  /* ---------- 紙吹雪 ---------- */
  var cvs = $("fx"), ctx = cvs.getContext("2d"), parts = [], fxRaf = 0;
  function fitCanvas(){
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    cvs.width = innerWidth * dpr; cvs.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  fitCanvas();
  addEventListener("resize", fitCanvas);

  var CONFETTI = ["#FFB627","#FFD75E","#3FE9FA","#FF2D95","#3DDC84","#FFFFFF"];
  function burst(count, power){
    if (reduced) return;
    var cx = innerWidth / 2, cy = innerHeight * 0.42;
    for (var i = 0; i < count; i++){
      var a = (-Math.PI / 2) + (Math.random() - 0.5) * 2.4;
      var sp = (Math.random() * 0.6 + 0.5) * power;
      parts.push({
        x: cx + (Math.random() - 0.5) * 90, y: cy + (Math.random() - 0.5) * 60,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        w: 6 + Math.random() * 8, h: 9 + Math.random() * 12,
        rot: Math.random() * 6.3, vr: (Math.random() - 0.5) * 0.34,
        c: CONFETTI[(Math.random() * CONFETTI.length) | 0]
      });
    }
    if (!fxRaf) fxRaf = requestAnimationFrame(fxLoop);
  }
  function fxLoop(){
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (var i = parts.length - 1; i >= 0; i--){
      var p = parts[i];
      p.vy += 0.32; p.vx *= 0.992; p.vy *= 0.992;
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      if (p.y > innerHeight + 60) { parts.splice(i, 1); continue; }
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.c; ctx.globalAlpha = 0.95;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
    if (parts.length) fxRaf = requestAnimationFrame(fxLoop);
    else { fxRaf = 0; ctx.clearRect(0, 0, innerWidth, innerHeight); }
  }
  function flash(){
    if (reduced) return;
    var f = $("flash");
    f.classList.remove("on"); void f.offsetWidth; f.classList.add("on");
  }
  function shake(){
    if (reduced) return;
    var s = $("shell");
    s.classList.remove("shake"); void s.offsetWidth; s.classList.add("shake");
  }
  function replay(el, cls){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

  /* ---------- 計測 ---------- */
  function tick(){
    var sec = (performance.now() - startAt) / 1000;
    if (!document.body.classList.contains("blind")){
      $("timer").textContent = sec.toFixed(2);
      $("ring").style.background =
        "conic-gradient(from -90deg, var(--amber-hot) " + ((sec % 1) * 360).toFixed(1) + "deg, rgba(255,182,39,0) 0deg)";
    }
    raf = requestAnimationFrame(tick);
  }

  function beginRun(){
    running = true;
    document.body.classList.add("running");
    setMood("run");
    $("startBtn").classList.add("hidden");
    $("stopBtn").classList.remove("hidden");
    startAt = performance.now();
    raf = requestAnimationFrame(tick);
  }

  var cdTimers = [];
  function start(){
    if (running || counting) return;
    ac();
    if (!useCountdown){ tone(1320, 0.16, "square", 0.2); beginRun(); return; }

    counting = true;
    document.body.classList.add("counting");
    var cd = $("countdown"), num = $("cdNum");
    cd.classList.remove("hidden");
    ["3", "2", "1", "GO!"].forEach(function(label, i){
      cdTimers.push(setTimeout(function(){
        num.textContent = label;
        num.className = (label === "GO!") ? "go" : "";
        replay(num, "pop");
        tone(label === "GO!" ? 1320 : 760, label === "GO!" ? 0.22 : 0.13, "square", label === "GO!" ? 0.22 : 0.16);
      }, i * 700));
    });
    cdTimers.push(setTimeout(function(){
      cd.classList.add("hidden");
      counting = false;
      document.body.classList.remove("counting");
      beginRun();
    }, 4 * 700 - 120));
  }

  function stop(){
    if (!running) return;
    running = false;
    cancelAnimationFrame(raf);
    var sec = Number(((performance.now() - startAt) / 1000).toFixed(2));
    document.body.classList.remove("running");
    setMood("hot");
    flash(); shake();
    tone(180, 0.24, "sawtooth", 0.2);
    showResult(sec, Number((sec - target).toFixed(2)));
  }

  var GRADES = [
    { max: 0,    label: "\u{1F308} PERFECT!!",  cls: "rainbow", conf: 260, notes: [[523,.16],[659,.16],[784,.16],[1047,.5]] },
    { max: 0.01, label: "\u{2B50} MIRACLE!",    cls: "hit",     conf: 200, notes: [[659,.15],[880,.15],[1175,.42]] },
    { max: 0.05, label: "\u{1F947} SUPER!",     cls: "hit",     conf: 140, notes: [[523,.14],[784,.14],[1047,.36]] },
    { max: 0.10, label: "\u{1F389} EXCELLENT!", cls: "hit",     conf: 90,  notes: [[523,.14],[659,.14],[880,.3]] },
    { max: 0.30, label: "\u{1F44D} GOOD!",      cls: "",        conf: 40,  notes: [[523,.14],[659,.26]] },
    { max: 1e9,  label: "TRY AGAIN",            cls: "",        conf: 0,   notes: [[220,.16],[165,.3]] }
  ];

  function showResult(sec, delta){
    var ad = Math.abs(delta), g = GRADES[GRADES.length - 1];
    for (var i = 0; i < GRADES.length; i++){ if (ad <= GRADES[i].max){ g = GRADES[i]; break; } }

    $("judge").textContent = g.label;
    $("judge").className = "judge " + g.cls;
    $("diff").textContent = (delta >= 0 ? "+" : "") + delta.toFixed(2) + " 秒";
    $("game").classList.add("hidden");
    $("result").classList.remove("hidden");
    replay($("judge"), "slam");

    var el = $("resultTime"), t0 = performance.now(), dur = reduced ? 0 : 520;
    (function up(){
      var k = dur ? Math.min(1, (performance.now() - t0) / dur) : 1;
      el.textContent = (sec * (1 - Math.pow(1 - k, 3))).toFixed(2);
      if (k < 1) requestAnimationFrame(up);
      else {
        el.textContent = sec.toFixed(2);
        melody(g.notes, g.cls ? "square" : "triangle", 0.2);
        if (g.conf) burst(g.conf, g.conf > 180 ? 17 : 13);
        if (g.conf > 180) setTimeout(function(){ burst(g.conf, 15); }, 420);
      }
    })();
  }

  function reset(){
    cdTimers.forEach(clearTimeout); cdTimers = [];
    counting = false;
    document.body.classList.remove("counting");
    setMood("idle");
    $("countdown").classList.add("hidden");
    $("result").classList.add("hidden");
    $("game").classList.remove("hidden");
    $("stopBtn").classList.add("hidden");
    $("startBtn").classList.remove("hidden");
    $("timer").textContent = "0.00";
    $("ring").style.background = "conic-gradient(from -90deg, var(--amber-hot) 0deg, rgba(255,182,39,0) 0deg)";
  }

  /* ---------- 操作 ---------- */
  $("startBtn").addEventListener("click", start);
  $("stopBtn").addEventListener("pointerdown", stop);
  $("resetBtn").addEventListener("click", reset);

  $("applyBtn").addEventListener("click", function(){
    var v = Number($("targetInput").value);
    if (v > 0){ target = v; $("targetLabel").textContent = v.toFixed(2); tone(880, 0.1, "square", 0.14); }
    else { $("targetInput").value = target; }
  });

  function toggleBtn(btn, on){
    btn.setAttribute("aria-pressed", on ? "true" : "false");
    btn.textContent = on ? "ON" : "OFF";
  }
  $("blindBtn").addEventListener("click", function(){
    toggleBtn(this, document.body.classList.toggle("blind"));
  });
  $("cdBtn").addEventListener("click", function(){
    useCountdown = !useCountdown; toggleBtn(this, useCountdown);
  });
  $("soundBtn").addEventListener("click", function(){
    soundOn = !soundOn; toggleBtn(this, soundOn);
    if (soundOn) tone(880, 0.12, "square", 0.16);
  });

  $("settingsBtn").addEventListener("click", function(){ $("settings").classList.remove("hidden"); });
  $("closeSettingsBtn").addEventListener("click", function(){ $("settings").classList.add("hidden"); });

  $("fsBtn").addEventListener("click", toggleFs);
  function toggleFs(){
    if (!document.fullscreenElement){
      if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
    } else { document.exitFullscreen(); }
  }

  document.addEventListener("keydown", function(e){
    if (e.target && e.target.tagName === "INPUT"){
      if (e.key === "Enter"){ e.preventDefault(); $("applyBtn").click(); }
      return;
    }
    if (e.key === "f" || e.key === "F") toggleFs();
    if (e.key === "Escape") $("settings").classList.add("hidden");
    if (e.code === "Space" || e.key === "Enter"){
      e.preventDefault();
      if (e.repeat) return;
      if (!$("settings").classList.contains("hidden")) return;
      if (running) stop();
      else if (counting) return;
      else if (!$("result").classList.contains("hidden")) reset();
      else start();
    }
  });
})();
</script>
</body>
</html>
